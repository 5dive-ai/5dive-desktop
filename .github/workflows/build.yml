name: build

# Every push and PR builds the .dmg on a real Mac and opens it once (smoke).
# A tag v* also publishes a GitHub Release with the .dmg and .zip attached.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      ticket:
        description: "CAPTURE-ONLY (DIVE-8583): one-time Clerk sign-in ticket for the demo account"
        required: false
        default: ""
      path:
        description: "page to open after sign-in"
        required: false
        default: "/"

permissions:
  contents: write

jobs:
  mac:
    if: github.event_name != 'workflow_dispatch' || inputs.ticket == ''
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build universal .dmg (ad-hoc signed, not notarized)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Smoke - the signed app launches and is still running after 25s
        run: |
          APP="dist/mac-universal/5dive.app"
          codesign --verify --deep --strict "$APP"
          open "$APP"
          sleep 25
          pgrep -x 5dive
          screencapture -x smoke.png || echo "no screen-recording permission on this runner"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 5dive-mac
          path: |
            dist/*.dmg
            dist/*.zip
            smoke.png
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip

  # CAPTURE-ONLY (DIVE-8583, never merged): the real app, signed in to the demo
  # account, with its menu-bar menu open. Dispatched with a one-time ticket.
  capture:
    # A push to the capture branch runs it dry (signed out) to prove the plumbing.
    if: (github.event_name == 'workflow_dispatch' && inputs.ticket != '') || (github.event_name == 'pull_request' && github.head_ref == 'dive-8583-capture')
    runs-on: macos-latest
    steps:
      # The ticket is read at run time from the event file, never through a
      # ${{ }} expression or env: block, so no step header prints it.
      - name: Mask the ticket
        run: |
          T=$(jq -r '.inputs.ticket // empty' "$GITHUB_EVENT_PATH")
          [ -n "$T" ] && echo "::add-mask::$T"
          true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the app (this Mac's arch only)
        run: npx electron-builder --mac --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Launch, sign in, shoot
        env:
          FIVEDIVE_CAPTURE: ${{ runner.temp }}/cap
          SHOT_PATH: ${{ inputs.path || '/' }}
        run: |
          SIGNIN_TICKET=$(jq -r '.inputs.ticket // empty' "$GITHUB_EVENT_PATH")
          export SIGNIN_TICKET="${SIGNIN_TICKET:-dry}"
          mkdir -p "$FIVEDIVE_CAPTURE"
          system_profiler SPDisplaysDataType | grep -i resolution || true
          APP=$(ls -d dist/mac*/5dive.app | head -1)
          "$APP/Contents/MacOS/5dive" > app.log 2>&1 &
          sleep 8
          node capture/drive.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture
          retention-days: 3
          path: |
            shots/
            app.log
