name: build

# Every push and PR builds the .dmg on a real Mac and opens it once (smoke).
# A tag v* also publishes a GitHub Release with the .dmg and .zip attached.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build universal .dmg (ad-hoc signed, not notarized)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Smoke - the signed app launches and is still running after 25s
        run: |
          APP="dist/mac-universal/5dive.app"
          codesign --verify --deep --strict "$APP"
          open "$APP"
          sleep 25
          pgrep -x 5dive
          screencapture -x smoke.png || echo "no screen-recording permission on this runner"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 5dive-mac
          path: |
            dist/*.dmg
            dist/*.zip
            smoke.png
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
