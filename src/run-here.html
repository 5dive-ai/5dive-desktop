<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Run 5dive on this Mac</title>
<style>
  :root { --bg: #1a1a1f; --ink: #f4f4f6; --muted: #a3a3ad; --signal: #4c8dff; --track: #2c2c34; --danger: #ff6b6b; }
  @media (prefers-color-scheme: light) { :root { --bg: #ffffff; --ink: #111114; --muted: #5d5d66; --track: #e6e6ea; --signal: #1f6bff; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; }
  body { display: flex; align-items: center; justify-content: center; padding: 40px 32px 28px; -webkit-app-region: drag; }
  main { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; }
  .icon { font-size: 40px; line-height: 1; }
  h1 { margin: 0; font-size: 21px; font-weight: 650; letter-spacing: -0.01em; }
  p { margin: 0; color: var(--muted); }
  .bar { width: 100%; height: 8px; border-radius: 99px; background: var(--track); overflow: hidden; margin-top: 6px; }
  .fill { height: 100%; width: 0; background: var(--signal); border-radius: 99px; transition: width .3s ease; }
  .bar.busy .fill { width: 35%; animation: slide 1.3s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(290%); } }
  .pct { font-variant-numeric: tabular-nums; font-size: 13px; }
  button { -webkit-app-region: no-drag; margin-top: 8px; min-height: 44px; width: 100%; border: 0; border-radius: 99px; background: var(--signal); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .err { color: var(--danger); word-break: break-word; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="icon" id="icon" aria-hidden="true">🐳</div>
  <h1 id="title">Checking Docker…</h1>
  <p id="line"></p>
  <div class="bar busy" id="bar"><div class="fill" id="fill"></div></div>
  <p class="pct" id="pct" hidden></p>
  <button id="act" hidden></button>
</main>
<script>
  // One screen per step of run-here.js. Words: the 3-second test, nothing technical.
  const SCREENS = {
    checking: { icon: "🐳", title: "Checking Docker…", bar: "busy" },
    docker: (s) =>
      s.state === "missing"
        ? { icon: "🐳", title: "Install Docker Desktop first", line: "5dive runs inside it. This moves on by itself once Docker is running.", act: ["Download Docker Desktop", "docker"] }
        : { icon: "🐳", title: "Open Docker Desktop", line: "5dive runs inside it. This moves on by itself once Docker is running.", bar: "busy" },
    pulling: (s) => ({ icon: "⬇️", title: "Downloading 5dive", line: "About 300 MB, only the first time.", bar: s.progress == null ? "busy" : s.progress }),
    starting: { icon: "🚀", title: "Starting 5dive", bar: "busy" },
    booting: { icon: "🚀", title: "Starting 5dive", bar: "busy" },
    linking: { icon: "🔗", title: "Connecting to your account", bar: "busy" },
    done: { icon: "✅", title: "5dive is running on this Mac", line: "Your agents work while this Mac is awake.", act: ["Open my team", "done"] },
    failed: (s) => ({ icon: "⚠️", title: "That didn't work", line: s.message || "", err: true, act: ["Try again", "retry"] }),
  };
  const $ = (id) => document.getElementById(id);
  let action = null;
  function render(s) {
    const def = SCREENS[s.step] || SCREENS.checking;
    const v = typeof def === "function" ? def(s) : def;
    $("icon").textContent = v.icon;
    $("title").textContent = v.title;
    $("line").textContent = v.line || "";
    $("line").hidden = !v.line;
    $("line").className = v.err ? "err" : "";
    const bar = $("bar");
    bar.hidden = v.bar == null;
    bar.classList.toggle("busy", v.bar === "busy");
    const pct = typeof v.bar === "number" ? Math.round(v.bar * 100) : null;
    $("fill").style.width = pct == null ? "" : pct + "%";
    $("pct").hidden = pct == null;
    $("pct").textContent = pct == null ? "" : pct + "%";
    $("act").hidden = !v.act;
    if (v.act) $("act").textContent = v.act[0];
    action = v.act ? v.act[1] : null;
  }
  $("act").addEventListener("click", () => {
    const d = window.fiveDesktop;
    if (!d || !action) return;
    if (action === "docker") d.openDocker();
    else if (action === "retry") d.retry();
    else if (action === "done") d.finish();
  });
  if (window.fiveDesktop && window.fiveDesktop.onRunState) window.fiveDesktop.onRunState(render);
  else {
    // Outside the app (a screenshot): the state comes in the address, #{"step":"pulling","progress":0.4}.
    try { render(JSON.parse(decodeURIComponent(location.hash.slice(1)))); } catch { render({ step: "checking" }); }
  }
</script>
</body>
</html>
