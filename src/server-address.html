<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Server address</title>
<style>
  :root { --bg: #1a1a1f; --ink: #f4f4f6; --muted: #a3a3ad; --signal: #4c8dff; --field: #2c2c34; --danger: #ff6b6b; }
  @media (prefers-color-scheme: light) { :root { --bg: #ffffff; --ink: #111114; --muted: #5d5d66; --field: #eeeef2; --signal: #1f6bff; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display: flex; align-items: center; justify-content: center; padding: 36px 28px 24px; }
  main { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
  h1 { margin: 0; font-size: 20px; font-weight: 650; }
  p { margin: 0; color: var(--muted); }
  input { width: 100%; min-height: 44px; padding: 0 14px; border: 1px solid transparent; border-radius: 10px; background: var(--field); color: var(--ink); font: inherit; }
  input:focus { outline: none; border-color: var(--signal); }
  button { min-height: 44px; width: 100%; border: 0; border-radius: 99px; background: var(--signal); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .link { background: none; color: var(--signal); min-height: 32px; font-weight: 500; }
  .err { color: var(--danger); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Server address</h1>
  <p>Leave empty to use 5dive online. Your office server? Ask IT for its address.</p>
  <input id="addr" type="text" spellcheck="false" autocomplete="off" placeholder="https://192.0.2.20:8443" aria-label="Server address">
  <p class="err" id="err" hidden></p>
  <button id="save">Save</button>
  <button class="link" id="online">Use 5dive online</button>
  <button class="link" id="forget" hidden>Forget saved certificate</button>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const d = window.fiveSettings;
  function show(s) {
    $("addr").value = s.server || "";
    $("online").hidden = !s.server;
    $("forget").hidden = !s.certificate;
  }
  async function save(value) {
    $("err").hidden = true;
    const r = await d.save(value);
    if (!r.ok) {
      $("err").textContent = r.error;
      $("err").hidden = false;
    }
  }
  $("save").addEventListener("click", () => save($("addr").value));
  $("addr").addEventListener("keydown", (e) => e.key === "Enter" && save($("addr").value));
  $("online").addEventListener("click", () => save(""));
  $("forget").addEventListener("click", async () => show(await d.forget()));
  if (d) d.get().then((s) => { show(s); $("addr").focus(); });
</script>
</body>
</html>
