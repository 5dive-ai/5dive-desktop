<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Agent is using your computer</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #16161b; color: #f4f4f6; font: 14px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
  body { display: flex; align-items: center; gap: 12px; padding: 0 12px 0 16px; border: 2px solid #ff6b6b; -webkit-app-region: drag; user-select: none; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #ff6b6b; flex: none; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .say { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { -webkit-app-region: no-drag; min-height: 38px; padding: 0 20px; border: 0; border-radius: 99px; background: #ff4d4d; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  button:hover { background: #ff3030; }
</style>
</head>
<body>
  <span class="dot"></span>
  <span class="say">Agent is using your computer</span>
  <button id="stop">Stop</button>
<script>
  const d = window.fiveDesktop;
  document.getElementById("stop").addEventListener("click", () => {
    document.querySelector(".say").textContent = "Stopping…";
    d.stop();
  });
</script>
</body>
</html>
